# Obscura — production (VPS, serveur dédié, poste local)
#   docker compose up -d --build
# Coolify : utiliser docker-compose.coolify.yml. Développement : docker-compose.dev.yml.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-obscura}
      POSTGRES_USER: ${DB_USER:-obscura}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - obscura_net
    healthcheck:
      # -h 127.0.0.1 : en TCP. Via le socket, le serveur temporaire de l'initialisation
      # (premier démarrage) répond déjà « prêt » alors que le port 5432 est encore fermé.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-obscura} -d ${DB_NAME:-obscura}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
    volumes:
      - storage_data:/app/storage
      - backend_data:/app/data   # clé maître de chiffrement (master.key)
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - obscura_net
    logging: *logging

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    networks:
      - obscura_net
    logging: *logging

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - storage_data:/var/www/storage:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - obscura_net
    logging: *logging

  # HTTPS Let's Encrypt automatique si DOMAIN est défini (sinon reste inactif)
  certbot:
    build:
      context: ./nginx/certbot
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - nginx
    logging: *logging

volumes:
  postgres_data:
  storage_data:
  backend_data:
  certbot_www:
  certbot_certs:

networks:
  obscura_net:
    driver: bridge
