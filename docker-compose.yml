version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wubalstore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wubalstore}
      POSTGRES_USER: ${DB_USER:-wubalstore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wubalstore_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wubalstore}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wubalstore_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wubalstore_net
    # Exposé uniquement en local : l'accès public passe par Nginx
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wubalstore_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - wubalstore_net
    ports:
      - "127.0.0.1:5173:5173"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: wubalstore_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - storage_data:/var/www/storage:ro
    depends_on:
      - backend
      - frontend
    networks:
      - wubalstore_net

volumes:
  postgres_data:
  storage_data:

networks:
  wubalstore_net:
    driver: bridge
