# Obscura — production (VPS, serveur dédié, NAS, poste local)
#   docker compose up -d --build
# Une seule application (API + interface) sur le port HTTP_PORT, plus PostgreSQL et Redis.
# HTTPS : tunnel Cloudflare ou reverse proxy (Caddy, Traefik…) devant ce port.
# Coolify : utiliser docker-compose.coolify.yml. Développement : docker-compose.dev.yml.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  obscura:
    build: .
    image: obscura
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
    ports:
      - "${HTTP_PORT:-80}:3000"
    volumes:
      - storage_data:/app/storage
      - backend_data:/app/data   # clé maître de chiffrement (master.key)
      # Détection de l'infrastructure : OS et nom de la machine hôte (lecture seule)
      - /etc/os-release:/host/os-release:ro
      - /etc/hostname:/host/hostname:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-obscura}
      POSTGRES_USER: ${DB_USER:-obscura}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 : en TCP. Via le socket, le serveur temporaire de l'initialisation
      # (premier démarrage) répond déjà « prêt » alors que le port 5432 est encore fermé.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-obscura} -d ${DB_NAME:-obscura}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  # Cache (comptes, permissions, liste blanche) et compteurs des limites de requêtes.
  # Rien d'indispensable dedans : pas de sauvegarde sur disque.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  postgres_data:
  storage_data:
  backend_data:
