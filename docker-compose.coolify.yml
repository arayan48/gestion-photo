# Obscura — déploiement via Coolify
# ------------------------------------------------------------
# Aucun port n'est publié sur l'hôte : le proxy de Coolify (Traefik) occupe déjà
# 80/443, termine le TLS et route vers le service `obscura` par le réseau Docker.
#   • Docker Compose Location : /docker-compose.coolify.yml
#   • Domaine : uniquement sur le service `obscura` (port 3000), ex. https://photos.exemple.com
#   • Variables : DB_PASSWORD (obligatoire), DB_NAME / DB_USER (optionnels)
# La vraie IP des visiteurs est lue dans X-Forwarded-For envoyé par Traefik
# (réseaux privés de confiance par défaut, cf. TRUST_PROXY).

services:
  obscura:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-obscura}
      DB_USER: ${DB_USER:-obscura}
      DB_PASSWORD: ${DB_PASSWORD:?}
      MASTER_KEY: ${MASTER_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      REDIS_URL: redis://redis:6379
    expose:
      - "3000"
    volumes:
      - storage_data:/app/storage
      - backend_data:/app/data   # clé maître de chiffrement (master.key)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-obscura}
      POSTGRES_USER: ${DB_USER:-obscura}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 : en TCP. Via le socket, le serveur temporaire de l'initialisation
      # (premier démarrage) répond déjà « prêt » alors que le port 5432 est encore fermé.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-obscura} -d ${DB_NAME:-obscura}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  storage_data:
  backend_data:
