# Obscura — déploiement via Coolify
# ------------------------------------------------------------
# Aucun port n'est publié sur l'hôte : le proxy de Coolify (Traefik) occupe déjà
# 80/443, termine le TLS et route vers le service `nginx` par le réseau Docker.
#   • Docker Compose Location : /docker-compose.coolify.yml
#   • Domaine : uniquement sur le service `nginx` (port 80), ex. https://photos.exemple.com
#   • Variables : DB_PASSWORD (obligatoire), DB_NAME / DB_USER (optionnels)
# La vraie IP des visiteurs est lue dans X-Forwarded-For envoyé par Traefik
# (réseaux privés de confiance par défaut, cf. TRUSTED_PROXIES).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-obscura}
      POSTGRES_USER: ${DB_USER:-obscura}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - obscura_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-obscura} -d ${DB_NAME:-obscura}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-obscura}
      DB_USER: ${DB_USER:-obscura}
      DB_PASSWORD: ${DB_PASSWORD:?}
      MASTER_KEY: ${MASTER_KEY:-}
    volumes:
      - storage_data:/app/storage
      - backend_data:/app/data   # clé maître de chiffrement (master.key)
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - obscura_net

  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    networks:
      - obscura_net

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    environment:
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    expose:
      - "80"
    volumes:
      - storage_data:/var/www/storage:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - obscura_net

volumes:
  postgres_data:
  storage_data:
  backend_data:

networks:
  obscura_net:
    driver: bridge
