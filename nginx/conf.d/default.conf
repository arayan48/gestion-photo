server {
    listen 80;
    server_name _;

    # Rediriger vers HTTPS en prod (commenter en dev)
    # return 301 https://$host$request_uri;

    # === API Backend ===
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # === Auth (rate limit strict) ===
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Upload (rate limit upload) ===
    location /api/files/upload {
        limit_req zone=upload burst=5 nodelay;
        client_max_body_size 500M;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # === WebSocket ===
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # === Thumbnails (servis directement depuis le volume de stockage) ===
    location /storage/thumbnails/ {
        alias /var/www/storage/thumbnails/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # === Médias (vérification IP whitelist via Fastify) ===
    location /media/ {
        # Vérification IP côté Nginx (couche 1)
        # La couche 2 est gérée par Fastify
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache pour les médias
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # === Frontend React ===
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
