server {
    listen 80;
    server_name _;

    # En-têtes de sécurité de base
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # === Login seul a un rate-limit strict (anti brute-force) ===
    location = /api/auth/login {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Upload (rate limit dédié) ===
    location /api/files/upload {
        limit_req zone=upload burst=5 nodelay;
        client_max_body_size 500M;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # === API Backend (toutes les routes) ===
    location /api/ {
        limit_req zone=api burst=30 nodelay;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # === WebSocket ===
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400;
    }

    # === Fichiers de stockage publics : miniatures et avatars UNIQUEMENT ===
    # Servis directement depuis le volume Docker (plus rapide, sans passer par le backend).
    # Les originaux passent par /api/files/:id/view (authentifié) ou /media/:token (liste blanche IP) ;
    # les sauvegardes (dump de la base !) et les zips ne doivent jamais être exposés.
    location ~ ^/storage/(thumbnails|avatars)/[^/]+$ {
        root /var/www;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    location /storage/ {
        return 404;
    }

    # === Médias publics (vérification IP whitelist via Fastify) ===
    location /media/ {
        proxy_pass http://backend:3000/api/files/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Frontend React ===
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
