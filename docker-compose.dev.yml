# Obscura — développement (rechargement à chaud)
#   docker compose -f docker-compose.dev.yml up --build
# Interface : http://localhost:5173 (Vite redirige /api, /storage et /ws vers le backend)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-obscura}
      POSTGRES_USER: ${DB_USER:-obscura}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-obscura}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-obscura}
      DB_USER: ${DB_USER:-obscura}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - storage_dev_data:/app/storage
      - backend_dev_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  postgres_dev_data:
  storage_dev_data:
  backend_dev_data:
