version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wubalstore_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wubalstore_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: wubalstore_backend
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wubalstore_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: wubalstore_frontend
    restart: always
    networks:
      - wubalstore_net

  nginx:
    image: nginx:1.25-alpine
    container_name: wubalstore_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - storage_data:/var/www/storage:ro
      - certbot_data:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - wubalstore_net

volumes:
  postgres_data:
  storage_data:
  certbot_data:

networks:
  wubalstore_net:
    driver: bridge
