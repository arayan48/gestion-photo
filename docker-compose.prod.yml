version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: obscura_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - obscura_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: obscura_backend
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
    volumes:
      - storage_data:/app/storage
      - backend_data:/app/data   # clé maître de chiffrement (master.key)
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - obscura_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: obscura_frontend
    restart: always
    networks:
      - obscura_net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: obscura_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - storage_data:/var/www/storage:ro
      - certbot_data:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - obscura_net

volumes:
  postgres_data:
  storage_data:
  backend_data:
  certbot_data:

networks:
  obscura_net:
    driver: bridge
